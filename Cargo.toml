[workspace]
members = ["crates/converter", "crates/daemon", "crates/llama"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.4.0"

[workspace.dependencies]
chrono = "0.4.41"
encoding_rs = "0.8.35"
icu_calendar = "2.1.1"
icu_datetime = "2.1.1"
icu_locale = "2.1.1"
rand = "0.9.2"
prost = "0.14.1"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
unicode-segmentation = "1.12.0"
writeable = "0.6.1"
