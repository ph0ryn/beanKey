[package]
name = "beankey-llama"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "beankey_llama"

[dependencies]
llama-cpp-sys-2 = { version = "=0.1.160", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-sys-2 = { version = "=0.1.160", default-features = false, features = ["metal"] }

[dev-dependencies]
tempfile = "3.27.0"
